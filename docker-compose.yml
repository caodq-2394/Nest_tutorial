services:
  # --- SERVICE DATABASE (MYSQL) ---
  api-db:
    image: mysql:8.0
    container_name: nest_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'Aa@123456'
      MYSQL_DATABASE: 'nest_tutorial'
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nest-network

  # --- SERVICE ZOOKEEPER (Quản lý Kafka) ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: nest_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - nest-network

  # --- SERVICE KAFKA BROKER ---
  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: nest_kafka_broker
    ports:
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Cấu hình cổng kết nối: nội bộ Docker dùng cổng 29092, ngoài máy thật dùng 9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper
    networks:
      - nest-network

  # --- SERVICE NESTJS ---
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nest_api_server
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DB_HOST: api-db
      # Khai báo đường dẫn trỏ tới container Kafka trong mạng nội bộ Docker
      KAFKA_BROKERS: kafka:29092
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - api-db
      - kafka
    networks:
      - nest-network

volumes:
  mysql_data:

networks:
  nest-network:
    driver: bridge
