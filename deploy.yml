name: CI/CD Pipeline Deployment

on:
  push:
    branches:
      - main # Kích hoạt khi push code vào nhánh main

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Cài đặt thư viện & Kiểm tra lỗi code
        run: |
          npm install --legacy-peer-deps
          npm run lint

  continuous-deployment:
    needs: continuous-integration
    runs-on: ubuntu-latest
    steps:
      - name: Deploy sang Server VPS qua SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }} # IP của VPS
          username: ${{ secrets.SERVER_USER }} # Username (thường là root)
          key: ${{ secrets.SERVER_SSH_KEY }} # Khóa SSH Private Key
          port: 22
          script: |
            # Di chuyển vào thư mục dự án trên VPS (Bạn cần tạo trước thư mục này)
            cd /var/www/nest-tutorial

            # Kéo code mới nhất từ GitHub về
            git pull origin main

            # Build lại image Docker và chạy ngầm (-d) bản Production
            docker compose -f docker-compose.prod.yml up --build -d

            # Chạy tự động cập nhật bảng cơ sở dữ liệu (Nếu dùng migration)
            docker exec prod_api_server npm run migration:run || true
