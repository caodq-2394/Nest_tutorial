services:
  api-db:
    image: postgres:16-alpine
    container_name: prod_postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}'
      POSTGRES_DB: '${POSTGRES_DB:-nest_tutorial}'
    ports:
      - '5432:5432'
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    networks:
      - prod-network

  api-server:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: prod_api_server
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: '${DATABASE_URL:?DATABASE_URL must be set}'
      DB_SSL: 'false'
    depends_on:
      - api-db
    networks:
      - prod-network

volumes:
  prod_postgres_data:

networks:
  prod-network:
    driver: bridge
